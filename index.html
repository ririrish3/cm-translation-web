<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM Translation - AI Comic Localization Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .badge { display: inline-block; padding: 6px 14px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #ffffff; }
    p { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 12px 28px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; }
  </style>
</head>

  <div class="card">
    <span class="badge">AI Localization in Progress</span>

    <a href="mailto:cunny.moment@cmtranslation.my.id" class="btn">Contact Us</a>
